# pytest.ini
# Pytest configuration for the semantic search project

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = -v --cov=. --cov-report=html --cov-report=term

# Test paths
testpaths = .

# Markers for categorizing tests
markers =
    critical: Critical tests that must pass (core functionality)
    important: Important tests for edge cases and error handling
    integration: Integration tests that test multiple components together
    unit: Unit tests for individual functions/classes
    slow: Tests that take longer to execute

# Logging
log_cli = false
log_cli_level = INFO
